<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amani Interiors Booking</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif&family=Manrope&display=swap" rel="stylesheet">

<style>
body { font-family: 'Manrope', sans-serif; }
.hidden { display:none; }
</style>

</head>

<body class="bg-gray-50 text-gray-800 pt-20">

<!-- HEADER -->
<header class="fixed top-0 w-full bg-white shadow z-50">
<div class="flex justify-between items-center px-6 py-4">

<!-- MENU -->
<button class="text-emerald-900">
<span id="menu-btn" class="cursor-pointer">☰</span>
</button>

<h1 class="font-serif tracking-widest">AMANI INTERIORS</h1>

<a href="https://calendly.com/vanessaaffiliates" target="_blank"
class="bg-green-900 text-white px-4 py-2 rounded text-sm">
Book Now
</a>

</div>

<nav id="menu" class="hidden absolute top-16 left-4 bg-white/70 backdrop-blur-md p-4 rounded w-52 shadow">
<ul class="space-y-2 font-bold text-emerald-900">
<li><a href="index.html">Home</a></li>
<li><a href="Aboutdesignermob.html">About</a></li>
<li><a href="Contactmob.html">Contact</a></li>
<li><a href="Portfoliomob.html">Portfolio</a></li>
<li><a href="Servicemob.html">Service</a></li>
<li><a href="Pricingmob.html">Pricing</a></li>
</ul>
</nav>
</header>

<!-- MAIN -->
<main class="max-w-xl mx-auto px-5 pb-40">

<!-- STEP 1 -->
<section id="step-1">
<h2 class="text-xl mb-6 font-serif">Select a Service</h2>

<div class="space-y-4">

<button class="service-card w-full border p-5 rounded"
data-name="Full Concept Design"
data-price="15000"
data-link="https://calendly.com/vanessaaffiliates/full-design">
Full Concept Design – KES 15,000
</button>

<button class="service-card w-full border p-5 rounded"
data-name="Styling Consultation"
data-price="5000"
data-link="https://calendly.com/vanessaaffiliates/styling">
Styling Consultation – KES 5,000
</button>

<button class="service-card w-full border p-5 rounded"
data-name="Discovery Call"
data-price="0"
data-link="https://calendly.com/vanessaaffiliates/discovery">
Discovery Call – FREE
</button>

</div>
</section>

<!-- STEP 2 -->
<section id="step-2" class="hidden mt-10">
<h2 class="text-xl mb-4 font-serif">Your Details</h2>

<input id="email" type="email" placeholder="Your Email"
class="w-full border-b p-3 mb-4">

<button id="pay-btn"
class="w-full bg-green-900 text-white py-4 rounded">
Pay & Continue
</button>

</section>

<!-- STEP 3 -->
<section id="step-3" class="hidden mt-10">
<h2 class="text-xl mb-4 font-serif">Pick Date & Time</h2>

<iframe id="calendly" class="w-full h-[600px] border rounded"></iframe>
</section>

</main>

<!-- BOTTOM BAR -->
<div class="fixed bottom-0 w-full bg-white border-t p-4">

<div class="flex justify-between mb-2">
<span id="service-name">None</span>
<span id="service-price">—</span>
</div>

<button id="continue" class="w-full bg-green-900 text-white py-3 rounded">
Continue
</button>

</div>

<!-- JS -->
<script>
document.addEventListener("DOMContentLoaded", () => {

const cards = document.querySelectorAll(".service-card");
const serviceName = document.getElementById("service-name");
const servicePrice = document.getElementById("service-price");

const step1 = document.getElementById("step-1");
const step2 = document.getElementById("step-2");
const step3 = document.getElementById("step-3");

const continueBtn = document.getElementById("continue");
const payBtn = document.getElementById("pay-btn");
const calendly = document.getElementById("calendly");

const menuBtn = document.getElementById("menu-btn");
const menu = document.getElementById("menu");

let selectedLink = "";
let selectedPrice = 0;

// MENU
menuBtn.onclick = () => menu.classList.toggle("hidden");

// SELECT SERVICE
cards.forEach(card => {
  card.onclick = () => {

    cards.forEach(c => {
      c.classList.remove("bg-green-900","text-white");
      const tick = c.querySelector(".tick");
      if (tick) tick.remove();
    });

    card.classList.add("bg-green-900","text-white");

    const tick = document.createElement("span");
    tick.innerHTML = "✔";
    tick.className = "tick absolute right-3 top-3 text-white";
    card.style.position = "relative";
    card.appendChild(tick);

    selectedLink = card.dataset.link;
    selectedPrice = Number(card.dataset.price);

    serviceName.textContent = card.dataset.name;
    servicePrice.textContent = "KES " + selectedPrice;

    // 🔥 Change button text dynamically
    payBtn.textContent = selectedPrice === 0
      ? "Continue to Booking"
      : "Pay & Continue";

  };
});

// STEP 1 → STEP 2
continueBtn.onclick = () => {
  if (!selectedLink) return alert("Select a service first");
  step1.classList.add("hidden");
  step2.classList.remove("hidden");
};

// PAYMENT / CONTINUE
payBtn.onclick = () => {

  const email = document.getElementById("email").value;
  if (!email) return alert("Enter your email");

  // FREE SERVICE → SKIP PAYMENT
  if (selectedPrice === 0) {
    loadCalendly(email);
    return;
  }

  let handler = PaystackPop.setup({
    key: "pk_live_f16d61523ac698c949a3302521822fbc569c03ac",
    email: email,
    amount: selectedPrice * 100,
    currency: "KES",
    ref: "AMANI_" + Date.now(),

    callback: function() {
      loadCalendly(email);
    }
  });

  handler.openIframe();
};

// LOAD CALENDLY
function loadCalendly(email) {
  step2.classList.add("hidden");
  step3.classList.remove("hidden");

  calendly.src =
    selectedLink + "?email=" + encodeURIComponent(email);
}

});
</script>

</body>
</html>
