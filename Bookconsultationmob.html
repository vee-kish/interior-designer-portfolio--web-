<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amani Interiors Booking</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif&family=Manrope&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Manrope', sans-serif;
}
</style>

</head>

<body class="bg-gray-50 text-gray-800">

<!-- HEADER -->
<header class="fixed top-0 w-full bg-white shadow z-50">
  <div class="flex justify-between items-center px-6 py-4">

    <span id="menu-btn" class="cursor-pointer">☰</span>

    <h1 class="font-serif tracking-widest">AMANI INTERIORS</h1>

    <a href="https://calendly.com/vanessaaffiliates" target="_blank"
       class="bg-green-900 text-white px-4 py-2 rounded text-sm">
       Book Now
    </a>

  </div>

  <!-- MENU -->
  <nav id="menu" class="hidden absolute top-16 left-4 bg-white shadow p-4 rounded w-48">
    <ul class="space-y-2">
      <li><a href="#">Home</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</header>

<!-- MAIN -->
<main class="pt-24 pb-40 max-w-xl mx-auto px-5">

<!-- STEP 1 -->
<section id="step-1">

<h2 class="text-xl mb-6 font-serif">Select a Service</h2>

<div class="space-y-4">

<button class="service-card w-full border p-5 rounded"
  data-name="Full Concept Design"
  data-price="KES 15,000"
  data-link="https://calendly.com/vanessaaffiliates/full-design">

  Full Concept Design – KES 15,000

</button>

<button class="service-card w-full border p-5 rounded"
  data-name="Styling Consultation"
  data-price="KES 5,000"
  data-link="https://calendly.com/vanessaaffiliates/styling">

  Styling Consultation – KES 5,000

</button>

<button class="service-card w-full border p-5 rounded"
  data-name="Discovery Call"
  data-price="FREE"
  data-link="https://calendly.com/vanessaaffiliates/discovery">

  Discovery Call – FREE

</button>

</div>

</section>

<!-- STEP 2 -->
<section id="step-2" class="hidden mt-10">

<h2 class="text-xl mb-4 font-serif">Your Details</h2>

<div id="client-form" class="space-y-4">

<input id="name" type="text" placeholder="Your Name"
class="w-full border-b p-3 outline-none">

<input id="email" type="email" placeholder="Your Email"
class="w-full border-b p-3 outline-none">

<textarea id="project" placeholder="Tell us about your project"
class="w-full border-b p-3 outline-none"></textarea>

<button id="go-calendly"
class="w-full bg-green-900 text-white py-4 rounded">
Continue to Booking
</button>

</div>

</section>

<!-- STEP 3 -->
<section id="step-3" class="hidden mt-10">

<h2 class="text-xl mb-4 font-serif">Pick Date & Time</h2>

<div class="w-full h-[600px] border rounded overflow-hidden">
  <iframe id="calendly"
    src=""
    width="100%"
    height="100%">
  </iframe>
</div>

</section>

</main>

<!-- BOTTOM BAR -->
<div class="fixed bottom-0 w-full bg-white border-t p-4">

<div class="flex justify-between mb-2">
  <span id="service-name">None</span>
  <span id="service-price">—</span>
</div>

<button id="continue"
class="w-full bg-green-900 text-white py-3 rounded">
Continue
</button>

</div>

<!-- JS -->
<script>

// MENU
const menuBtn = document.getElementById("menu-btn");
const menu = document.getElementById("menu");

menuBtn.onclick = () => menu.classList.toggle("hidden");

// ELEMENTS
const cards = document.querySelectorAll(".service-card");
const serviceName = document.getElementById("service-name");
const servicePrice = document.getElementById("service-price");

const step1 = document.getElementById("step-1");
const step2 = document.getElementById("step-2");
const step3 = document.getElementById("step-3");

const continueBtn = document.getElementById("continue");

const calendly = document.getElementById("calendly");

let selectedLink = "";

// SELECT SERVICE
cards.forEach(card => {
  card.onclick = () => {

    cards.forEach(c => c.classList.remove("bg-green-900","text-white"));

    card.classList.add("bg-green-900","text-white");

    serviceName.textContent = card.dataset.name;
    servicePrice.textContent = card.dataset.price;

    selectedLink = card.dataset.link;

  };
});

// STEP 1 → STEP 2
continueBtn.onclick = () => {

  if (!selectedLink) {
    alert("Select a service first");
    return;
  }

  step1.classList.add("hidden");
  step2.classList.remove("hidden");

  window.scrollTo({top:0, behavior:"smooth"});
};

// STEP 2 → STEP 3
document.getElementById("go-calendly").onclick = () => {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;

  if (!name || !email) {
    alert("Fill in your details");
    return;
  }

  step2.classList.add("hidden");
  step3.classList.remove("hidden");

  calendly.src =
    selectedLink +
    "?name=" + encodeURIComponent(name) +
    "&email=" + encodeURIComponent(email);

};

</script>
  <script>
document.addEventListener("DOMContentLoaded", () => {

const cards = document.querySelectorAll(".service-card");
const serviceName = document.getElementById("service-name");
const servicePrice = document.getElementById("service-price");

const step1 = document.getElementById("step-1");
const step2 = document.getElementById("step-2");
const step3 = document.getElementById("step-3");

const continueBtn = document.getElementById("continue");
const calendly = document.getElementById("calendly");

let selectedLink = "";
let selectedService = "";

// 🔥 SELECT SERVICE
cards.forEach(card => {
  card.addEventListener("click", () => {

    cards.forEach(c => {
      c.classList.remove("bg-green-900","text-white");
      const tick = c.querySelector(".tick");
      if (tick) tick.remove();
    });

    card.classList.add("bg-green-900","text-white");

    // ✅ ADD TICK
    const tick = document.createElement("span");
    tick.innerHTML = "✔";
    tick.className = "tick absolute top-3 right-3 text-white text-lg";
    card.style.position = "relative";
    card.appendChild(tick);

    selectedService = card.dataset.name;
    selectedLink = card.dataset.link;

    serviceName.textContent = selectedService;
    servicePrice.textContent = card.dataset.price;

  });
});

// 🔥 STEP 1 → STEP 2
continueBtn.addEventListener("click", () => {

  if (!selectedLink) {
    alert("Please select a service first");
    return;
  }

  step1.classList.add("hidden");
  step2.classList.remove("hidden");

  window.scrollTo({top:0, behavior:"smooth"});
});

// 🔥 STEP 2 → STEP 3
document.getElementById("go-calendly").addEventListener("click", async () => {

  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;

  if (!name || !email) {
    alert("Fill in your details");
    return;
  }

  // ✅ SEND TO GOOGLE SHEETS
  await fetch("https://YOUR-WEBHOOK-URL", {
    method: "POST",
    body: JSON.stringify({
      name,
      email,
      service: selectedService
    }),
    headers: {
      "Content-Type": "application/json"
    }
  });

  step2.classList.add("hidden");
  step3.classList.remove("hidden");

  // 🔥 LOAD CALENDLY PROPERLY
  calendly.src = selectedLink +
    "?name=" + encodeURIComponent(name) +
    "&email=" + encodeURIComponent(email);

});

// 🔥 MENU FIX
const menuBtn = document.getElementById("menu-btn");
const menu = document.getElementById("menu");

menuBtn.addEventListener("click", () => {
  menu.classList.toggle("hidden");
});

});
</script>
  <script>
    function doPost(e) {
  var sheet = SpreadsheetApp.getActiveSheet();
  var data = JSON.parse(e.postData.contents);

  sheet.appendRow([
    data.name,
    data.email,
    data.service,
    new Date()
  ]);

  return ContentService.createTextOutput("Success");
}
  </script>

</body>
</html>
